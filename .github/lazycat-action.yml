version: 1
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/application.lpk
  target_arch: amd64
update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: wallabag
build:
  toolchains: []
  run_buildscript: false
images:
  - id: wallabag
    target: service
    service: wallabag
    source: wallabag/wallabag
    channel: stable
    sort: semver
    tag_regex: ^2[.]6[.][0-9]+$
    delivery:
      mode: mirror
      require_digest_match: true
release:
  use_github_release_notes: true
  store_changelog_format: plain
stores:
  official:
    enabled: false
  private:
    enabled: false
    name: Wallabag
    skip_if_version_exists: true
